display:
  label: Shows
  chart: library
value:
  unit: count
source:
  url: "{metrics_url}/library/sections"
extract:
  for_each:
    items: '[.MediaContainer.Directory[] | select(.type == "show") | .key]'
    request:
      url: "{metrics_url}/library/sections/{item}/all"
    value: '.MediaContainer.size // .MediaContainer.totalSize // 0'
    reduce: sum
