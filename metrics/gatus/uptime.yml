display:
  label: Uptime
value:
  kind: uptime
parameters:
  group:
    label: Gatus group
    type: url_component
    transform: gatus_key
  name:
    label: Gatus endpoint name
    type: url_component
    transform: gatus_key
source:
  url: '{metric_source}/api/v1/endpoints/{group}_{name}/statuses'
  query:
    pageSize: 100
  initial:
    query:
      pageSize: 1000
extract:
  jq: '[.items[] | { timestamp, status: (if .success then "up" else "down" end), responseTimeMs: (.duration / 1000000) }]'
  pagination:
    initial_only: true
    items: .results
    next: 'if (.pageNumber * .pageSize) < .totalNumberOfResults then .pageNumber + 1 else 0 end'
