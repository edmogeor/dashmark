display:
  label: Users
  chart: none
value:
  unit: count
source:
  url: "{metric_source}/api/v3/core/users/?page_size=1"
  authentication:
    kind: token
    header: Authorization
    prefix: "Bearer "
    value:
      env: DASHMARK_AUTHENTIK_TOKEN
      label: dashmark.metric_token
extract:
  jq: .pagination.count
