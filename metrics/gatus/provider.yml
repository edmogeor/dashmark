source:
  headers:
    Accept: application/json
transforms:
  gatus_key:
    trim: true
    lowercase: true
    replace:
      '/': '-'
      '_': '-'
      '.': '-'
      ',': '-'
      ' ': '-'
      '#': '-'
      '+': '-'
      '&': '-'
notes: Dashmark polls the newest 500 Gatus results. Enable ENABLE_METRIC_BACKFILL=true for shared bulk history recovery. Use persistent SQLite or Postgres storage and increase storage.maximum-number-of-results to retain the desired history.
