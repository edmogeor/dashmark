source:
  headers:
    Accept: application/json
transforms:
  gatus_key:
    trim: true
    lowercase: true
    replace:
      '/': '-'
      '_': '-'
      '.': '-'
      ',': '-'
      ' ': '-'
      '#': '-'
      '+': '-'
      '&': '-'
notes: Dashmark polls the newest 100 Gatus history results. Use persistent SQLite or Postgres storage and increase storage.maximum-number-of-results to retain the uptime history you want Dashmark to display.
