services:
  dashmark:
    image: ghcr.io/edmogeor/dashmark:latest
    container_name: dashmark
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - ./config/config.example.yml:/app/config.yml:ro
      - ./icons:/app/icons:ro
      - ./data:/app/data
      # - ./custom.css:/app/custom.css:ro
    environment:
      # Points Dashmark at the socket-proxy sidecar below. When unset, Dashmark
      # uses the local Docker socket at unix:///var/run/docker.sock.
      - DOCKER_HOSTS=tcp://dockerproxy:2375

      # Multiple Docker hosts use named endpoints. The IDs can be referenced in
      # YAML overrides, for example `home/plex` and `vps/plex`.
      # - DOCKER_HOSTS=home=tcp://dockerproxy:2375,vps=tcp://vps-proxy:2375

      # Optional settings, shown with their defaults. Uncomment one to change it.
      # - PORT=4321
      # - CONFIG_FILE=/app/config.yml
      # - ICONS_DIR=/app/icons
      # - CUSTOM_STYLESHEET=/app/custom.css
       # - ENABLE_ACCESS_CONTROL=false
      # - ACCESS_GROUPS_HEADER=auto
      # - SHOW_SEARCH=true
      # - SHOW_STATUS=true
       # - STATUS_BADGE_ACCESS=admins,operators
       # - SHOW_METRICS=true
       # - METRICS_ACCESS=admins,operators
      # - METRICS_DATABASE_PATH=/app/data/metrics.db
      # - METRICS_POLL_INTERVAL=2
      # - METRICS_HISTORY_PERIOD=300
      # - STATUS_POLL_INTERVAL=30
      # - CATEGORY_ORDER=Media,Productivity,Home
      # - ENABLE_AUTOMATIC_DESCRIPTIONS=true
      # - ENABLE_AUTOMATIC_ICONS=true
      # - SHOW_BRANDING=true
      # - SHOW_HEADER=true
      # - SHOW_GROUP_TAGS=true
      # - SHOW_THEME_TOGGLE=true
      # - AUTH_TOKEN=                # shared secret; when set, requests must send "X-Dashmark-Token: <token>"
      # - CUSTOM_HEADER="{greeting}, {first_name}!"   # no default; this is an example
      # - GREETING_MORNING=Good morning
      # - GREETING_AFTERNOON=Good afternoon
      # - GREETING_EVENING=Good evening
    depends_on:
      - dockerproxy
    restart: unless-stopped

  dockerproxy:
    image: wollomatic/socket-proxy:1
    container_name: dashmark-dockerproxy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      - "-allowfrom=dashmark"
      - "-allowGET=/version"
      - "-allowGET=/v1\\..{1,2}/containers/json"
      - "-allowGET=/v1\\..{1,2}/containers/.*/stats"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
