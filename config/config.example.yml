# Dashmark service config.
#
# Each top-level key is a service, keyed by its container name or Compose
# service name. A key matching a running container overrides that container's
# `dashmark.*` labels; a key with no matching container becomes a standalone
# card (it needs a `url` and has no status badge).
#
# Limit status badges by authenticated group with the environment variable
# STATUS_BADGE_ACCESS=admins,operators. Access matching is case-insensitive.

# Override the card for a container you run. Omitted fields fall back to the
# container's labels or defaults.
plex:
  title: Plex
  description: Media server
  url: https://plex.home.local
  icon: selfhst:plex
  category: Media
  order: 1
  # Set false to hide this card's status badge.
  show_status: false
  # Metrics default to CPU, memory, and network. Use `none` to disable them,
  # or list the built-in and configured custom metrics this card should expose.
  metrics:
    - cpu
    - memory
  # Bind provider-scoped metrics such as `radarr/active_downloads` to this
  # card. Dashmark never infers this from the container image or name.
  # metric_provider: radarr
  # Custom metric sources are defined separately, so they can be selected in
  # `metrics` alongside the built-in values.
  # custom_metrics:
  #   active_downloads:
  #     label: Active downloads
  #     unit: count
  #     source:
  #       url: http://metrics.example.internal/radarr
  #       headers:
  #         X-Api-Key: { env: RADARR_API_KEY }
  #     json:
  #       path: /queue
  #       value_path: /records
  #       reduce: count
  #   version:
  #     label: Version
  #     value_type: string
  #     source:
  #       url: http://metrics.example.internal/metrics
  #     prometheus:
  #       name: app_build_info
  #       value_label: version
  # Override the defaults from METRICS_POLL_INTERVAL and
  # METRICS_HISTORY_PERIOD for one card, in seconds.
  metrics_poll_interval: 10
  metrics_history_period: 900
  search_aliases:
    - movies
    - watch later

# A standalone card for a service Dashmark does not run. Only `url` is
# required.
github:
  title: GitHub
  url: https://github.com
  icon: selfhst:github
  category: External

# When DOCKER_HOSTS=home=...,vps=... is configured, prefix a key with a host
# ID to override only that host's container or Compose service. A
# host-qualified key takes precedence over an unqualified key.
vps/plex:
  title: VPS Plex

# Restrict a card to these access entries when ENABLE_ACCESS_CONTROL=true. Cards with
# no `access` entries are visible to everyone. Entries match groups, usernames, and emails.
portainer:
  url: https://portainer.home.local
  category: Management
  access:
    - admins

# Hide a container so it does not appear on the dashboard.
speedtest:
  hidden: true
