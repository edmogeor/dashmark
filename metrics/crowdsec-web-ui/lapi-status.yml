display:
  label: LAPI status
  chart: security
value:
  kind: state
  default_color: disabled
  colors:
    connected: success
    disconnected: error
  labels:
    connected: Connected
    disconnected: Disconnected
source:
  url: "{metrics_url}/api/config"
extract:
  jq: if .lapi_status.isConnected then "connected" else "disconnected" end
