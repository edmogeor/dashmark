source:
  authentication:
    kind: cookie_session
    optional: true
    requests:
      - url: "{metric_source}/api/v2/auth/login"
        method: POST
        form:
          username:
            env: DASHMARK_QBITTORRENT_USERNAME
            label: dashmark.metric_username
          password:
            env: DASHMARK_QBITTORRENT_PASSWORD
            label: dashmark.metric_password
charts:
  transfer: line
  queue: step
