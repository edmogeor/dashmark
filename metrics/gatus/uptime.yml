display:
  label: Uptime
value:
  kind: uptime
parameters:
  group:
    label: Gatus group
    type: url_component
    transform: gatus_key
  name:
    label: Gatus endpoint name
    type: url_component
    transform: gatus_key
source:
  url: '{metric_source}/api/v1/endpoints/{group}_{name}/statuses'
  query:
    pageSize: 500
extract:
  pagination:
    recover: true
    items: '.results'
    next: 'if (.results | length) == 500 then $page + 1 else null end'
    bulk:
      url: '{metric_source}/api/v1/endpoints/statuses'
      key: '{group}_{name}'
      page_size_parameter: pageSize
      jq: 'map({key: .key, value: [.results[] | {timestamp, status: (if .success then "up" else "down" end), responseTimeMs: (.duration / 1000000)}]}) | from_entries'
  jq: '[.items[] | { timestamp, status: (if .success then "up" else "down" end), responseTimeMs: (.duration / 1000000) }]'
