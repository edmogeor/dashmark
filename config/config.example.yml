# Dashmark configuration.
#
# `settings` configures the dashboard and overrides environment variables.
# CONFIG_FILE must stay in the environment. auth_token may reference an
# environment variable or secret file, but never contains a literal secret.
# List values accept YAML lists, one value, or a comma-separated string.
#
settings:
  # port: 4321
  # docker_hosts: home=tcp://dockerproxy:2375,vps=tcp://vps-proxy:2375
  # docker_hosts: [home=tcp://dockerproxy:2375, vps=tcp://vps-proxy:2375]
  # icons_dir: /app/icons
  # custom_stylesheet: /app/custom.css
  # enable_access_control: false
  # access_groups_header: auto
  # user_name_header: X-Custom-Name
  # user_username_header: X-Custom-Username
  # user_email_header: X-Custom-Email
  # user_first_name_header: X-Custom-Given-Name
  # user_last_name_header: X-Custom-Family-Name
  # show_header: true
  # show_group_tags: true
  # show_theme_toggle: true
  # custom_header: "{greeting}, {first_name}!"
  # greeting_morning: Good morning
  # greeting_afternoon: Good afternoon
  # greeting_evening: Good evening
  # auth_token: { env: DASHMARK_AUTH_TOKEN }
  # auth_token: { file: /run/secrets/dashmark_auth_token }
  # show_search: true
  # show_status: true
  # status_badge_access: admins, operators
  # show_metrics: true
  # metrics_access: admins, operators
  # metrics_database_path: /app/data/metrics.db
  # metrics_poll_interval: 2
  # metrics_history_period: 300
  # status_poll_interval: 30
  # category_order: [Media, Productivity, Home]
  # enable_automatic_descriptions: true
  # enable_automatic_icons: true
  # show_branding: true
  # new_tab: false

# Each top-level key is a service, keyed by its container name or Compose
# service name. A key matching a running container overrides that container's
# `dashmark.*` labels; a key with no matching container becomes a standalone
# card (it needs a `url` and has no status badge).
#
# Override the card for a container you run. Omitted fields fall back to the
# container's labels or defaults.
plex:
  title: Plex
  description: Media server
  url: https://plex.home.local
  icon: selfhst:plex
  category: Media
  order: 1
  # Set false to hide this card's status badge.
  show_status: false
  # Metrics default to CPU, memory, and network. Use `none` to disable them,
  # or list the built-in and configured custom metrics this card should expose.
  metrics:
    - cpu
    - memory
  # Allow catalog metrics from one or more providers. Dashmark never infers
  # these from the container image or name.
  # metric_providers:
  #   - plex
  #   - uptime-kuma
  # Custom metric sources are defined separately, so they can be selected in
  # `metrics` alongside the built-in values.
  # custom_metrics:
  #   active_downloads:
  #     label: Active downloads
  #     unit: count
  #     source:
  #       url: http://metrics.example.internal/radarr
   #       headers:
   #         X-Api-Key: { env: RADARR_API_KEY }
    #     jq: '.queue.records | length'
   #   download_speed:
   #     label: Download
   #     unit: bytes_per_second
   #     source:
   #       url: http://qbittorrent:8080/api/v2/transfer/info
   #       auth:
   #         type: cookie_session
   #         login:
   #           url: http://qbittorrent:8080/api/v2/auth/login
   #           method: POST
   #           form:
   #             username: { env: DASHMARK_QBITTORRENT_USERNAME }
   #             password: { file: /run/secrets/qbittorrent_password }
   #     jq: .dl_info_speed
   #   read_rate:
   #     label: Read
   #     unit: bytes_per_second
   #     chart: line
   #     chart_group: disk_io
   #     source: { url: http://metrics.example.internal/io }
   #     jq: .read_bytes_per_second
  #   version:
  #     label: Version
  #     value_type: string
  #     source:
  #       url: http://metrics.example.internal/metrics
  #     prometheus:
  #       name: app_build_info
  #       value_label: version
  # Override the defaults from METRICS_POLL_INTERVAL and
  # METRICS_HISTORY_PERIOD for one card, in seconds.
  metrics_poll_interval: 10
  metrics_history_period: 900
  # Restrict individual metrics without changing card visibility. Omitted keys
  # remain visible to users permitted by the global metrics_access setting.
  # metrics_access:
  #   cpu: admins
  #   radarr/active_downloads: media, operators
  search_aliases:
    - movies
    - watch later

# A standalone card for a service Dashmark does not run. Only `url` is
# required.
github:
  title: GitHub
  url: https://github.com
  icon: selfhst:github
  category: External

# When DOCKER_HOSTS=home=...,vps=... is configured, prefix a key with a host
# ID to override only that host's container or Compose service. A
# host-qualified key takes precedence over an unqualified key.
vps/plex:
  title: VPS Plex

# Restrict a card to these access entries when ENABLE_ACCESS_CONTROL=true. Cards with
# no `access` entries are visible to everyone. Entries match groups, usernames, and emails.
portainer:
  url: https://portainer.home.local
  category: Management
  access:
    - admins

# Hide a container so it does not appear on the dashboard.
speedtest:
  hidden: true
