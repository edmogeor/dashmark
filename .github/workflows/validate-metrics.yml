name: Validate custom metrics

on:
  pull_request:
    paths:
      - 'metrics/**/*.yml'
      - 'metrics/CATALOG.md'
      - 'scripts/validate-metrics.mjs'
      - '.github/PULL_REQUEST_TEMPLATE/metric.md'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:metrics
