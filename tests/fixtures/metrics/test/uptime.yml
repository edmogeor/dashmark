display:
  label: Uptime
value:
  kind: uptime
parameters:
  group:
    label: Endpoint group
    type: url_component
    transform: endpoint_key
  name:
    label: Endpoint name
    type: url_component
    transform: endpoint_key
source:
  url: "{metric_source}/api/endpoints/{group}_{name}/statuses"
extract:
  jq: '[.results[] | { timestamp, status: (if .success then "up" else "down" end), responseTimeMs: (.duration / 1000000) }]'
