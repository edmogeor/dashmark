source:
  authentication:
    kind: cookie_session
    optional: true
    requests:
      - url: "{api_url}/api/auth/login"
        method: POST
        json:
          username:
            env: DASHMARK_CROWDSEC_WEB_UI_USERNAME
            label: dashmark.metric_username
          password:
            env: DASHMARK_CROWDSEC_WEB_UI_PASSWORD
            label: dashmark.metric_password
charts:
  security: step
