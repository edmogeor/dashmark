# Dashmark configuration.
#
# `settings` configures the dashboard and overrides environment variables.
# CONFIG_FILE must stay in the environment. auth_token may reference an
# environment variable or secret file, but never contains a literal secret.
# List values accept YAML lists, one value, or a comma-separated string.
#
settings:
  # port: 4321
  # docker_hosts: home=tcp://dockerproxy:2375,vps=tcp://vps-proxy:2375
  # docker_hosts: [home=tcp://dockerproxy:2375, vps=tcp://vps-proxy:2375]
  # icons_dir: /data/icons
  # custom_stylesheet: /data/custom.css
  # enable_access_control: false
  # access_groups_header: auto
  # user_name_header: X-Custom-Name
  # user_username_header: X-Custom-Username
  # user_email_header: X-Custom-Email
  # user_first_name_header: X-Custom-Given-Name
  # user_last_name_header: X-Custom-Family-Name
  # show_header: true
  # show_group_tags: true
  # show_theme_toggle: true
  # custom_header: "{greeting}, {first_name}!"
  # greeting_morning: Good morning
  # greeting_afternoon: Good afternoon
  # greeting_evening: Good evening
  # auth_token: { env: DASHMARK_AUTH_TOKEN }
  # auth_token: { file: /run/secrets/dashmark_auth_token }
  # show_search: true
  # show_status: true
  # status_badge_access: admins, operators
  # show_metrics: true
  # Set a mounted path to retain metric history across container restarts.
  # metrics_database_path: /data/metrics.db
  # status_poll_interval: 30
  # category_order: [Media, Productivity, Home]
  # enable_automatic_descriptions: true
  # enable_automatic_icons: true
  # show_branding: true
  # new_tab: false

# Reuse an HTTP API address, authentication, headers, or query values across
# local metrics on different cards. A metric uses one with `source.use` and an
# absolute `source.path`.
# shared_metric_sources:
#   home_assistant:
#     base_url: http://homeassistant:8123
#     authentication:
#       kind: token
#       header: Authorization
#       prefix: "Bearer "
#       value: { env: HOME_ASSISTANT_TOKEN }

# Each top-level key is a service, keyed by its container name or Compose
# service name. A key matching a running container overrides that container's
# `dashmark.*` labels; a key with no matching container becomes a standalone
# card (it needs a `url` and has no status badge). Standalone cards can define
# custom and library metrics, but not Docker CPU, memory, or network metrics.
#
# Override the card for a container you run. Omitted fields fall back to the
# container's labels or defaults.
plex:
  title: Plex
  description: Media server
  url: https://plex.home.local
  icon: selfhst:plex
  category: Media
  order: 1
  # Set false to hide this card's status badge.
  show_status: false
# All YAML metric configuration lives under `metrics`. Docker labels remain a
# separate input path. These YAML keys have no aliases: `metrics` lists,
# `metric_providers`, `metrics_url`, `metric_parameters`,
# `metrics_poll_interval`, `metrics_history_period`, `metrics_access`, and
# `custom_metrics` are removed.
  metrics:
    # sources: { plex: http://plex:32400 }
    collection:
      interval: 10s
      retention: 15m
    charts:
      library: { label: Library, unit: count, style: step }
    entries:
      cpu: { visible_to: admins }
      memory: {}
      network: {}
      plex/movies: {}
      active_sessions:
        display: { label: Active sessions, chart: library }
        value: { kind: number, unit: count }
        source:
          url: http://plex:32400/status/sessions
          headers: { X-Plex-Token: { env: PLEX_TOKEN } }
        extract: { jq: '.MediaContainer.size' }
  search_aliases:
    - movies
    - watch later

# A standalone card for a service Dashmark does not run. Only `url` is
# required.
github:
  title: GitHub
  url: https://github.com
  icon: selfhst:github
  category: External

# When DOCKER_HOSTS=home=...,vps=... is configured, prefix a key with a host
# ID to override only that host's container or Compose service. A
# host-qualified key takes precedence over an unqualified key.
vps/plex:
  title: VPS Plex

# Restrict a card to these access entries when ENABLE_ACCESS_CONTROL=true. Cards with
# no `access` entries are visible to everyone. Entries match groups, usernames, and emails.
portainer:
  url: https://portainer.home.local
  category: Management
  access:
    - admins

# Hide a container so it does not appear on the dashboard.
speedtest:
  hidden: true
